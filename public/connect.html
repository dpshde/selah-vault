<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>Allow access · Selah Vault</title>
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="/favicon.r2.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.r2.png">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/connect.css">
  <script type="module" src="/report.js"></script>
  <script type="module" src="/connect.js"></script>
</head>
<body class="oauth">
<div class="monologue-grain" aria-hidden="true"><div class="monologue-grain__tile"></div></div>
<main class="oauth-main">
  <section class="oauth-card" id="bad" hidden>
    <div class="oauth-logos"><img src="/favicon.svg?v=2" alt="" width="48" height="48"></div>
    <h1 class="oauth-title">This app can't connect</h1>
    <p class="oauth-sub" id="bad-detail">The OAuth request is incomplete, or the app isn't on Selah Vault's list of allowed apps.</p>
    <p class="oauth-foot">Nothing was shared.</p>
  </section>

  <section class="oauth-card" id="card" hidden>
    <div class="oauth-logos" aria-hidden="true">
      <span class="oauth-logo" id="app-logo"></span>
      <span class="oauth-link"><span></span><span></span><span></span></span>
      <span class="oauth-logo"><img src="/favicon.svg?v=2" alt="" width="48" height="48"></span>
    </div>
    <h1 class="oauth-title"><span class="app-name"></span> wants to access your Selah Vault</h1>
    <p class="oauth-origin"><span class="app-name"></span> · <span id="app-origin"></span></p>

    <div id="step-signin" hidden>
      <p class="oauth-step">Sign in to continue</p>
      <div class="auth-stack">
        <button type="button" id="passkey-login" class="oauth-primary wide auth-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4.25"/><path d="M11.2 12.8 20 4v3.5"/><path d="M16.5 5.5 19 8"/></svg>
          <span>Continue with Passkey</span>
        </button>
        <button type="button" id="apple-login" class="oauth-secondary wide auth-btn" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M16.37 12.63c.02 2.27 1.99 3.03 2.01 3.04-.02.05-.31 1.08-1.04 2.14-.63.92-1.29 1.84-2.32 1.86-1.01.02-1.34-.6-2.5-.6-1.16 0-1.53.58-2.48.62-1 .04-1.76-1-2.4-1.91-1.3-1.88-2.3-5.31-.96-7.64.66-1.16 1.85-1.89 3.14-1.91.98-.02 1.91.66 2.5.66.6 0 1.72-.82 2.9-.7.49.02 1.88.2 2.77 1.5-.07.05-1.65.96-1.62 2.94ZM14.47 7.11c.53-.64.88-1.53.79-2.42-.76.03-1.68.51-2.22 1.15-.49.56-.92 1.47-.8 2.34.85.07 1.71-.43 2.23-1.07Z"/></svg>
          <span>Sign in with Apple</span>
        </button>
        <button type="button" id="email-login" class="oauth-secondary wide auth-btn" aria-expanded="false" aria-controls="email-send-form">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="6" width="17" height="12" rx="1.2"/><path d="m3.5 6 8.5 6.2L20.5 6"/></svg>
          <span>Continue with Email</span>
        </button>
      </div>
      <form id="email-send-form" class="email-auth-form" autocomplete="on" hidden>
        <label>Email <input id="email-input" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
        <button type="submit" class="oauth-secondary wide">Send 6-digit code</button>
      </form>
      <form id="email-verify-form" class="email-auth-form" autocomplete="off" hidden>
        <label>6-digit code <input id="otp-input" name="code" type="text" inputmode="numeric" pattern="[0-9]6" maxlength="6" autocomplete="one-time-code" placeholder="123456" required></label>
        <button type="submit" class="oauth-primary wide">Verify code</button>
      </form>
      <p class="oauth-sub" id="passkey-create-row">New here? <button type="button" id="passkey-register" class="oauth-switch">Create a passkey</button></p>
      <p class="error" role="alert" id="signin-error"></p>
    </div>

    <div id="step-consent" hidden>
      <div class="oauth-account">
        <span class="oauth-avatar" id="account-initial" aria-hidden="true"></span>
        <span class="oauth-account__text">Signed in as <strong id="account-name"></strong></span>
        <button type="button" class="oauth-switch" id="switch">Switch</button>
      </div>
      <p class="oauth-step">This will allow <span class="app-name"></span> to:</p>
      <ul class="oauth-perms" id="perms"></ul>
      <div class="oauth-actions">
        <button type="button" id="deny" class="oauth-secondary">Cancel</button>
        <button type="button" id="allow" class="oauth-primary">Allow</button>
      </div>
      <p class="error" role="alert" id="consent-error"></p>
    </div>

    <p class="oauth-foot">You'll be redirected to <span class="app-name"></span>. Only allow apps you trust.</p>
  </section>
</main>
</body>
</html>

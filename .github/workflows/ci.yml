# Continuous Integration: runs every quality gate via mise on pushes to main and PRs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Hygiene, Typecheck, Test & Dry-Run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain via mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: mise run install

      - name: Run repository hygiene checks
        run: mise run hygiene

      - name: Typecheck (tsrs + tsc)
        run: mise run typecheck

      - name: Run test suite
        run: mise run test

      - name: Dry-run selah-vault Worker bundle
        run: mise run dry-run

      - name: Dry-run selah-jev Worker bundle
        run: mise run jev:dry-run
